    });
    el.classList.add('wm');
    wins[id] = { el: el, head: head, isPage: isPage, btns: btns };

    el.addEventListener('pointerdown', function () { bringToFront(id); });
    head.addEventListener('dblclick', function (e) { if (!e.target.closest('button')) setMode(id, 'max'); });

    // перетаскивание за заголовок
    head.addEventListener('pointerdown', function (e) {
      if (e.button !== 0 || e.target.closest('button')) return;
      e.preventDefault();
      const start = currentRect(id), sx = e.clientX, sy = e.clientY;
      let moved = false;
      head.setPointerCapture(e.pointerId);
      function move(ev) {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (!moved && Math.hypot(dx, dy) < 4) return;
        if (!moved) {
          moved = true;
          const st = layout[id] || {};
          // из прикреплённого или развёрнутого состояния окно «отрывается» в прежнем размере
          const base = (st.mode && st.mode !== 'float' && st.float) ? st.float : start;
          layout[id] = { mode: 'float', min: !!st.min, x: start.x, y: start.y, w: base.w, h: base.h };
          el.classList.add('wm-drag');
        }
        const st2 = layout[id];
        st2.x = start.x + dx; st2.y = start.y + dy;
        applyGeom(id);
      }
      function up() {
        head.removeEventListener('pointermove', move); head.removeEventListener('pointerup', up);
        el.classList.remove('wm-drag');
        if (!moved) return;
        // отпустили у края экрана — прикрепить, как в Windows
        const st2 = layout[id];
        if (lastPointer.x <= 6) setMode(id, 'left');
        else if (lastPointer.x >= innerWidth - 6) setMode(id, 'right');
        else if (lastPointer.y <= 4) setMode(id, 'max');
        else { Object.assign(st2, clampRect(id, st2)); applyGeom(id); saveLayout(); }
      }
      head.addEventListener('pointermove', move); head.addEventListener('pointerup', up);
    });

    // изменение размера за края и углы
    el.querySelectorAll(':scope > .wm-rz').forEach(function (h) {
      h.addEventListener('pointerdown', function (e) {
        if (e.button !== 0) return;
        e.preventDefault(); e.stopPropagation();
        const d = h.dataset.dir, start = currentRect(id), sx = e.clientX, sy = e.clientY, m = minSize(id);
        const st0 = layout[id] || {};
        layout[id] = { mode: 'float', min: false, x: start.x, y: start.y, w: start.w, h: start.h };
        el.classList.add('wm-drag');
        h.setPointerCapture(e.pointerId);
        function move(ev) {
          const dx = ev.clientX - sx, dy = ev.clientY - sy, r = layout[id];
          if (d.indexOf('e') >= 0) r.w = Math.max(m.w, start.w + dx);
          if (d.indexOf('s') >= 0) r.h = Math.max(m.h, start.h + dy);
          if (d.indexOf('w') >= 0) { r.w = Math.max(m.w, start.w - dx); r.x = start.x + start.w - r.w; }
          if (d.indexOf('n') >= 0) { r.h = Math.max(m.h, start.h - dy); r.y = start.y + start.h - r.h; }
          applyGeom(id);
        }
        function up() {
          h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up);
          el.classList.remove('wm-drag');
          Object.assign(layout[id], clampRect(id, layout[id])); applyGeom(id); saveLayout();
        }
        h.addEventListener('pointermove', move); h.addEventListener('pointerup', up);
        void st0;
      });
    });
  }
  const lastPointer = { x: 0, y: 0 };
  window.addEventListener('pointermove', function (e) { lastPointer.x = e.clientX; lastPointer.y = e.clientY; }, true);

  ['missions', 'inbox', 'system', 'settings'].forEach(function (n) { makeWindow(document.getElementById('panel-' + n), n, false); });
  makeWindow(page, 'page', true);

  window.addEventListener('resize', function () {
    Object.keys(wins).forEach(function (id) { if (!wins[id].el.hidden) applyGeom(id); });
    placeCaptions();
  });
  document.getElementById('resetLayout').addEventListener('click', function () {
    layout = layout._prefs ? { _prefs: layout._prefs } : {}; saveLayout();
    Object.keys(wins).forEach(function (id) { applyGeom(id); });
  });
  function refreshWinLabels() {
    Object.keys(wins).forEach(function (id) {
      const w = wins[id];
      w.head.title = t('win_drag');
      w.btns.left.title = t('win_left'); w.btns.left.setAttribute('aria-label', t('win_left'));
      w.btns.right.title = t('win_right'); w.btns.right.setAttribute('aria-label', t('win_right'));
      const c = w.head.querySelector('.win-ctl .win-btn:last-child');
      if (!w.isPage && c) { c.title = t('win_close'); c.setAttribute('aria-label', t('win_close')); }
      applyGeom(id);
    });
  }

  // Субтитры не должны налезать на открытый раздел: переезжают в свободную часть экрана
  function placeCaptions() {
    const cap = document.querySelector('.captions');
    if (!cap) return;
    if (page.hidden || !currentPage) { cap.style.left = ''; cap.style.width = ''; cap.style.display = ''; return; }
    const r = page.getBoundingClientRect(), vw = innerWidth;
    const freeL = r.right + 24, freeR = vw - 24;
    const freeLeft = r.left - 24 - 88;
    if (freeR - freeL >= 280) {
      cap.style.display = ''; cap.style.left = ((freeL + freeR) / 2) + 'px'; cap.style.width = Math.min(820, freeR - freeL) + 'px';
    } else if (freeLeft >= 280) {
      cap.style.display = ''; cap.style.left = (88 + 24 + freeLeft / 2) + 'px'; cap.style.width = Math.min(820, freeLeft) + 'px';
    } else {
      cap.style.display = 'none';          // места нет — всё и так видно в разделе
    }
  }

  // ===========================================================================
  // Заставка запуска: «рождение звезды» + проверка систем + звук
  // и финал при выключении: галактика сворачивается обратно в точку
  // ===========================================================================
  function easeIO(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function easeO(x) { return 1 - Math.pow(1 - x, 3); }
  function seg(t, a, b) { return Math.max(0, Math.min(1, (t - a) / (b - a))); }
  const TL = { gatherA: 0.5, gatherB: 2.6, flash: 2.6, unfoldA: 2.7, unfoldB: 5.4, ringsA: 4.3, ringsB: 6.0, word: 5.2, end: 6.6 };
  const bootlog = document.getElementById('bootlog'), bootLines = document.getElementById('bootLines'),
        bootSum = document.getElementById('bootSum'), bootCredit = document.getElementById('bootCredit');

  function introShort() { return !!(layout._prefs && layout._prefs.shortIntro); }
  function syncIntroChip() {
    const b = document.getElementById('introShortBtn');
    if (b) b.setAttribute('aria-pressed', String(introShort()));
  }
  document.getElementById('introShortBtn').addEventListener('click', function () {
    layout._prefs = Object.assign({}, layout._prefs, { shortIntro: !introShort() });
    syncIntroChip(); saveLayout();
  });

  function startIntro() {
    if (intro.started) return;
    if (document.hidden) {                          // окно ещё не на экране — ждём, пока покажется
      document.addEventListener('visibilitychange', function onVis() {
        if (!document.hidden) { document.removeEventListener('visibilitychange', onVis); startIntro(); }
      });
      return;
    }
    intro.started = true; intro.active = true; intro.mode = 'intro';
    intro.scale = introShort() ? 0.35 : 1;
    intro.t0 = performance.now(); intro.fired = {}; intro.elapsed = 0;
    applyI18n(bootlog); applyI18n(bootCredit);
    loadBootLog();
  }
  function skipIntro() {
    if (!intro.active || intro.mode !== 'intro' || !intro.started) return;
    const t = (intro.elapsed || 0) / intro.scale;
    if (t < 1.0) return;                              // случайный щелчок в первую секунду не пропускает заставку
    if (t < TL.end - 0.4) intro.elapsed = (TL.end - 0.4) * intro.scale;
  }
  window.addEventListener('pointerdown', skipIntro, true);
  window.addEventListener('keydown', skipIntro, true);

  function once(key, fn) { if (!intro.fired[key]) { intro.fired[key] = true; fn(); } }
  function updateIntro(dt, raw) {
    if (!intro.active) return;
    if (!intro.started) return;                                   // ждём настроек — экран тёмный
    intro.elapsed = (intro.elapsed || 0) + (raw ? dt : Math.min(dt || 0, 0.05));   // время идёт по показанным кадрам
    const t = intro.elapsed / intro.scale;
    if (intro.mode === 'intro') {
      intro.bg = easeO(seg(t, 0.2, 3.5));
      intro.gather = easeIO(seg(t, TL.gatherA, TL.gatherB));
      intro.unfold = easeO(seg(t, TL.unfoldA, TL.unfoldB));
      const s = seg(t, TL.flash, TL.flash + 0.9);
      intro.star = t < TL.flash ? 0.05 * seg(t, 0.3, 0.9) : Math.min(1.25, easeO(s) * (1 + 0.25 * Math.sin(s * Math.PI)));
      intro.flash = t < TL.flash ? 0 : Math.max(0, 1 - (t - TL.flash) / 0.7);
      intro.rings = easeO(seg(t, TL.ringsA, TL.ringsB));
      if (t >= TL.gatherA) once('swell', function () { cinematic('swell', intro.scale); });
      if (t >= TL.flash) once('flash', function () { cinematic('impact'); call('intro_done_ui').catch(function () {}); });
      if (t >= TL.ringsA) once('hud', function () { document.body.classList.remove('intro'); });
      if (t >= TL.word) once('word', function () { wordmarkEl.classList.add('show'); bootCredit.classList.add('show'); cinematic('pad', intro.scale); });
      if (t >= TL.end) once('end', function () {
        intro.active = false;
        intro.gather = intro.unfold = intro.star = intro.rings = intro.bg = 1; intro.flash = 0;
        setTimeout(function () { bootCredit.classList.remove('show'); }, 2500);
        setTimeout(function () { bootlog.classList.add('done'); }, 3200);
      });
    } else {                                                     // финал
      intro.gather = 1;
      intro.rings = 1 - easeO(seg(t, 0, 0.8));
      intro.unfold = 1 - easeIO(seg(t, 0.3, 2.0));
      intro.bg = 1 - seg(t, 0.6, 2.3);
      intro.star = (t < 1.9 ? 1 : Math.max(0.05, 1 - easeIO(seg(t, 1.9, 2.4)) * 0.95)) * (1 - seg(t, 2.5, 2.8));
      intro.flash = t < 2.4 ? 0 : Math.max(0, 0.7 * (1 - (t - 2.4) / 0.5));
      if (t >= 2.5) once('crt', function () {
        document.getElementById('shutdown-overlay').classList.add('active');
        document.getElementById('crt-line').classList.add('play');
      });
      if (t >= 3.1) once('quit', function () { call('confirm_quit').catch(console.log); });
    }
  }
  // страховка: если кадры почему-то не рисуются (нет WebGL), заставка всё равно доходит до конца
  setInterval(function () {
    if (intro.active && intro.started && !document.hidden && performance.now() - (intro.lastFrame || 0) > 1000) updateIntro(0.25, true);
  }, 250);
  function startOutro() {
    intro.started = true; intro.active = true; intro.mode = 'outro';
    intro.scale = 1; intro.t0 = performance.now(); intro.fired = {}; intro.elapsed = 0;
    document.body.classList.add('outro');
    wordmarkEl.classList.add('show', 'hide');
    cinematic('fall'); setTimeout(function () { cinematic('off'); }, 2300);
  }

  // Журнал проверки систем: настоящие данные из Python
  function bootLine(label, value, ok) {
    const row = el('div', 'bl-line' + (ok ? '' : ' bad'));
    row.appendChild(el('span', 'bl-label', label));
    row.appendChild(el('span', 'bl-dots'));
    if (value !== '' && value !== null && value !== undefined) row.appendChild(el('span', 'bl-val', String(value)));
    row.appendChild(el('span', 'bl-mark', ok ? '✓' : '✗'));
    return row;
  }
  function fmtBoot(item) {
    const v = item.value;
    if (item.key === 'groq' && item.ok) return v + ' ' + t('journal_ms');
    if (typeof v === 'number') return v.toLocaleString(lang === 'ru' ? 'ru-RU' : 'en-US');
    return v ? String(v).slice(0, 34) : '';
  }
  async function loadBootLog() {
    bootLines.textContent = ''; bootSum.textContent = '';
    bootlog.classList.add('show');
    let items = [];
    try { items = await call('get_boot_status'); } catch (e) { items = [{ key: 'core', ok: true, value: '' }]; }
    const step = 170 * intro.scale;
    let bad = 0;
    items.forEach(function (it, i) {
      if (!it.ok) bad++;
      setTimeout(function () { bootLines.appendChild(bootLine(t('boot_' + it.key), fmtBoot(it), it.ok)); }, i * step);
    });
    let groq;
    try { groq = await call('ping_groq_ui'); } catch (e) { groq = { key: 'groq', ok: false, value: '' }; }
    setTimeout(function () {
      if (!groq.ok) bad++;
      bootLines.appendChild(bootLine(t('boot_groq'), fmtBoot(groq), groq.ok));
      bootSum.textContent = bad ? t('boot_issues') + ': ' + bad : t('boot_ready');
      bootSum.className = 'bl-sum ' + (bad ? 'bad' : 'ok');
    }, items.length * step);
  }

  // ===========================================================================
  // Клавиатура
  // ===========================================================================
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (document.querySelector('.dd.open')) return;
    if (!page.hidden) closePage(); else closePanel();
  });

  // ===========================================================================
  // Выключение с анимацией (как раньше)
  // ===========================================================================
  let shutdownStarted = false;
  function playShutdown() {
    if (shutdownStarted) return;
    shutdownStarted = true;
    setAmbient(false);
    closePanel(); if (!page.hidden) closePage();
    startOutro();
  }

  // ===========================================================================
  // Главный цикл опроса состояния
  // ===========================================================================
  async function pollState() {
    try {
      const s = await call('get_state');
      // тема и акцент могут меняться голосом («тёмная тема») — держим их в синхроне с Python
      // только что выбрали в настройках — не даём опросу, отправленному раньше, вернуть старое значение
      const prefSettled = performance.now() - localPrefAt > 1500;
      if (prefSettled && s.theme && s.theme !== theme) applyTheme(s.theme);
      if (prefSettled && s.accent_color && String(s.accent_color).toLowerCase() !== accent.toLowerCase()) {
        applyAccent(ACCENTS.find(function (a) { return a.toLowerCase() === String(s.accent_color).toLowerCase(); }) || s.accent_color);
      }
      if (s.language && s.language !== lang) setUiLang(s.language);     // язык могли сменить голосом
      if (s.state !== state) setState(s.state);
      live.env = s.speech_envelope || []; live.dur = s.speech_duration || 0;
      live.elapsed = s.speech_elapsed || 0; live.at = performance.now();
      live.mic = s.mic_level || 0;
      lastSys = s;
      if (openPanel === 'system') renderGauges();
      document.getElementById('missionBadge').hidden = !(s.missions_running > 0);
      document.getElementById('missionBadge').textContent = String(s.missions_running || '');
      onChatHistory(s.chat_history || []);
      updateCaptions(s.state === 'speaking' ? s.text : '');
      checkNotifications(s.notif_count || 0);
      checkTrace(s.trace_seq);
      checkHolo(s.holo_seq);
      checkGestures(s);
      if (s.should_quit) { playShutdown(); return; }
    } catch (e) { console.log(e); }
    setTimeout(pollState, 200);
  }

  // ===========================================================================
  // Запуск
  // ===========================================================================
  setUiLang('ru');
  setState('idle');
  updateClock();
  renderInbox();
  let started = false;
  function start() {
    if (started) return;
    started = true;
    call('get_ui_layout').then(function (txt) {
      try { layout = JSON.parse(txt || '{}') || {}; } catch (e) { layout = {}; }
      Object.keys(wins).forEach(function (id) { if (!wins[id].el.hidden) applyGeom(id); });
      syncIntroChip(); syncTraceChip(); syncGestures();
      startIntro();
    }).catch(function () { startIntro(); });
    populateSettings();
    pollState();
  }
  window.addEventListener('pywebviewready', start);
  setTimeout(function () { if (!intro.started) startIntro(); }, 4000);   // без Python — всё равно показать сцену
  if (window.pywebview && window.pywebview.api) start();
})();
</script>
</body>
</html>
