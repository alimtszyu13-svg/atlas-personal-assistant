<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas · Записи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Exo+2:wght@400;500;600&display=swap">
<style>
  :root {
    --void: #02040A; --panel: rgba(9, 17, 34, .78); --panel-2: rgba(12, 24, 46, .9);
    --line: rgba(120, 170, 255, .16); --line-2: rgba(134, 214, 255, .34);
    --text: #EAF2FF; --muted: #93A7CC; --ion: #86D6FF; --rec: #22E06B; --rec-dim: #13843F; --amber: #F5C542; --bad: #FF7A7A;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: radial-gradient(ellipse at 20% -10%, #0B1F45 0%, transparent 55%),
    radial-gradient(ellipse at 110% 110%, #0A2A2A 0%, transparent 50%), var(--void);
    color: var(--text); font: 14px/1.45 "Exo 2", "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ion); outline-offset: 2px; }
  .app { height: 100%; display: grid; grid-template-rows: auto 1fr; gap: 14px; padding: 18px 20px 20px; }

  /* --- верх: название и запись --- */
  .top { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: stretch; }
  .brand { display: flex; flex-direction: column; justify-content: center; gap: 4px; padding-right: 6px; }
  .brand h1 { margin: 0; font: 600 18px Unbounded, sans-serif; letter-spacing: .22em; }
  .brand p { margin: 0; color: var(--muted); font-size: 12.5px; }
  .rec { position: relative; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px;
    border: 1px solid var(--line); background: var(--panel); min-height: 74px; overflow: hidden; }
  .rec.on { border-color: rgba(34, 224, 107, .45); box-shadow: 0 0 0 1px rgba(34,224,107,.08), 0 0 36px -10px rgba(34,224,107,.45); }
  .rec.busy { border-color: rgba(245, 197, 66, .45); }
  .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; background: #2A3550; }
  .rec.on .dot { background: var(--rec); animation: pulse 1.2s ease-in-out infinite; }
  .rec.busy .dot { background: var(--amber); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(34,224,107,.55); } 50% { box-shadow: 0 0 0 7px rgba(34,224,107,0); } }
  .idle-form { display: flex; gap: 10px; align-items: center; flex: 1; flex-wrap: wrap; }
  .idle-form #title { flex: 1 1 220px; min-width: 160px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(2, 6, 16, .55); outline: none; }
  .idle-form #title:focus { border-color: var(--line-2); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; background: rgba(2,6,16,.45); }
  .seg button { border: 0; background: none; padding: 7px 12px; border-radius: 7px; color: var(--muted); white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: rgba(134,214,255,.14); color: var(--text); }
  .go { border: 1px solid rgba(34,224,107,.5); background: rgba(34,224,107,.12); color: #CFFFE0; padding: 10px 16px;
    border-radius: 10px; font-weight: 600; white-space: nowrap; }
  .go:hover { background: rgba(34,224,107,.22); }
  .live-info { flex: 1; min-width: 0; display: none; gap: 14px; align-items: center; }
  .rec.on .live-info, .rec.busy .live-info { display: flex; }
  .rec.on .idle-form, .rec.busy .idle-form { display: none; }
  .live-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .live-sub { color: var(--muted); font-size: 12.5px; }
  .timer { font: 600 20px Unbounded, sans-serif; letter-spacing: .06em; font-variant-numeric: tabular-nums; color: #CFFFE0; }
  .rec.busy .timer { color: var(--amber); font-size: 14px; }
  .meter { width: 120px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.07); overflow: hidden; flex: none; }
  .meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--rec-dim), var(--rec));
    transition: width .2s; }
  .stop { border: 1px solid rgba(255,122,122,.5); background: rgba(255,122,122,.1); color: #FFD9D9; padding: 10px 16px;
    border-radius: 10px; font-weight: 600; white-space: nowrap; }
  .rec.busy .stop, .rec.busy .meter { display: none; }

  /* --- низ: список и запись --- */
  .main { min-height: 0; display: grid; grid-template-columns: 300px 1fr; gap: 14px; }
  .list, .view { min-height: 0; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); }
  .list { display: flex; flex-direction: column; overflow: hidden; }
  .list .search { padding: 12px; border-bottom: 1px solid var(--line); }
  .list .search input { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(2,6,16,.5); outline: none; }
  .items { overflow: auto; padding: 6px; }
  .item { width: 100%; text-align: left; display: block; border: 1px solid transparent; background: none; padding: 10px 12px;
    border-radius: 11px; margin-bottom: 2px; }
  .item:hover { background: rgba(134,214,255,.06); }
  .item[aria-current="true"] { border-color: var(--line-2); background: rgba(134,214,255,.1); }
  .item b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item span { color: var(--muted); font-size: 12px; }
  .item .live { color: var(--rec); }
  .item .live.busy { color: var(--amber); }
  .empty { color: var(--muted); padding: 24px 16px; text-align: center; font-size: 13px; }

  .view { display: grid; grid-template-rows: auto auto auto 1fr auto auto; overflow: hidden; }
  .head { padding: 16px 18px 10px; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  .head h2 { margin: 0; font-size: 19px; font-weight: 600; outline: none; border-radius: 6px; padding: 0 4px; margin-left: -4px; }
  .head h2[contenteditable="true"]:hover { background: rgba(134,214,255,.06); }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .acts button { border: 1px solid var(--line); background: rgba(134,214,255,.05); padding: 7px 11px; border-radius: 9px; font-size: 13px; }
  .acts button:hover { background: rgba(134,214,255,.13); }
  .acts .del:hover { border-color: rgba(255,122,122,.5); color: #FFD0D0; }
  .tabs { display: flex; gap: 4px; padding: 0 18px; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; background: none; padding: 9px 12px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--ion); }
  .body { overflow: auto; padding: 16px 22px 22px; }
  .notes h3 { margin: 18px 0 8px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--ion); font-weight: 600; }
  .notes h3:first-child { margin-top: 0; }
  .notes p { margin: 0 0 8px; }
  .notes ul { margin: 0 0 8px; padding-left: 20px; }
  .notes li { margin: 3px 0; }
  .notes li.task { list-style: none; margin-left: -20px; display: flex; gap: 8px; }
  .notes li.task::before { content: ""; width: 14px; height: 14px; border: 1.5px solid var(--line-2); border-radius: 4px; flex: none; margin-top: 3px; }
  .t { font-variant-numeric: tabular-nums; color: var(--ion); opacity: .8; }
  .lines div { padding: 3px 0; display: grid; grid-template-columns: 62px 1fr; gap: 8px; }
  .lines .t { font-size: 12.5px; padding-top: 1px; }
  .player { padding: 0 18px 12px; }
  .player video { width: 100%; max-height: 38vh; background: #000; border-radius: 12px; border: 1px solid var(--line); display: block; }
  .player audio { width: 100%; display: block; }
  .player .nomedia { color: var(--muted); font-size: 12.5px; }
  .lines div[data-t] { cursor: pointer; border-radius: 8px; padding: 3px 6px; margin: 0 -6px; }
  .lines div[data-t]:hover { background: rgba(134,214,255,.07); }
  .lines div.now { background: rgba(34,224,107,.1); box-shadow: inset 2px 0 0 var(--rec); }
  .notes .t[data-t] { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
  .notes .t[data-t]:hover { opacity: 1; color: #fff; }
  .hint { color: var(--muted); font-size: 12px; padding: 8px 18px; border-top: 1px solid var(--line); }
  .chk { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); white-space: nowrap; cursor: pointer; user-select: none; }
  .chk input { accent-color: #22E06B; width: 16px; height: 16px; }
  .kind { display: inline-block; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; padding: 1px 6px;
    border-radius: 6px; border: 1px solid var(--line); margin-left: 6px; color: var(--muted); }
  .ask { border-top: 1px solid var(--line); padding: 12px 18px; display: grid; gap: 8px; }
  .ask form { display: flex; gap: 8px; }
  .ask input { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(2,6,16,.5); outline: none; }
  .ask button { border: 1px solid var(--line-2); background: rgba(134,214,255,.1); padding: 0 14px; border-radius: 10px; }
  .answer { color: var(--text); background: rgba(134,214,255,.06); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; }
  .answer[hidden] { display: none; }
  .placeholder { height: 100%; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 30px; }
  .placeholder b { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line-2);
    padding: 10px 16px; border-radius: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 80%; }
  .toast.show { opacity: 1; }
  ::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: rgba(134,214,255,.15); border-radius: 5px; border: 3px solid transparent; background-clip: padding-box; }
  @media (max-width: 760px) { .main { grid-template-columns: 1fr; } .list { max-height: 34vh; } .top { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><h1>ЗАПИСИ</h1><p>Созвоны, лекции и видео — текст и конспект</p></div>
    <section class="rec" id="rec" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <form class="idle-form" id="startForm">
        <input id="title" placeholder="Название — например, «Созвон с командой»" aria-label="Название записи">
        <div class="seg" role="group" aria-label="Что записывать">
          <button type="button" id="mCall" aria-pressed="true" title="Звук компьютера и твой микрофон">Созвон</button>
          <button type="button" id="mVideo" aria-pressed="false" title="Только звук компьютера">Видео / лекция</button>
        </div>
        <label class="chk" title="Записать ещё и экран — получится видео"><input type="checkbox" id="scr"> Экран</label>
        <button class="go" type="submit">Начать запись</button>
      </form>
      <div class="live-info">
        <div style="min-width:0;flex:1">
          <div class="live-title" id="liveTitle"></div>
          <div class="live-sub" id="liveSub"></div>
        </div>
        <div class="meter" aria-hidden="true"><i id="meter"></i></div>
        <div class="timer" id="timer">00:00</div>
        <button class="stop" id="stopBtn" type="button">Остановить</button>
      </div>
    </section>
  </div>

  <div class="main">
    <aside class="list">
      <div class="search"><input id="filter" placeholder="Найти запись" aria-label="Найти запись"></div>
      <div class="items" id="items"></div>
    </aside>
    <section class="view" id="view">
      <div class="placeholder" id="placeholder"><div><b>Здесь будут твои записи</b>Скажи «Атлас, запиши созвон» или «запиши это видео» —<br>или нажми «Начать запись» сверху.</div></div>
    </section>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const api = () => (window.pywebview && window.pywebview.api) || null;
  async function call(name, ...args) {
    const a = api();
    if (!a || !a[name]) return null;
    try { return await a[name](...args); } catch (e) { console.error(name, e); return null; }
  }
  const secs = (t) => String(t).split(":").reduce((a, x) => a * 60 + Number(x), 0);
  const esc = (s) => String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmt = (s) => { s = Math.max(0, s | 0); const h = (s / 3600) | 0, m = ((s % 3600) / 60) | 0, x = s % 60;
    return (h ? h + ":" + String(m).padStart(2, "0") : String(m).padStart(2, "0")) + ":" + String(x).padStart(2, "0"); };
  const when = (ts) => { const d = new Date(ts * 1000);
    return d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" }) + ", " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }); };
  function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove("show"), 3200); }

  // ---------- markdown конспекта (только то, что пишет Atlas) ----------
  function inline(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\[(\d{1,2}:\d{2}(?::\d{2})?)\]/g,
      (_, t) => '<span class="t" data-t="' + secs(t) + '" title="Перейти к этому месту записи">' + t + "</span>");
  }
  function md(text) {
    const out = []; let list = false;
    const close = () => { if (list) { out.push("</ul>"); list = false; } };
    for (const raw of String(text || "").split("\n")) {
      const l = raw.trimEnd();
      if (/^#\s/.test(l) || /^\d{2}\.\d{2}\.\d{4} \d{2}:\d{2} · \d+ мин$/.test(l)) { close(); continue; }   // уже сверху
      if (/^#{2,3}\s/.test(l)) { close(); out.push("<h3>" + inline(l.replace(/^#+\s*/, "")) + "</h3>"); continue; }
      const task = l.match(/^\s*[-*]\s+\[[ xX]\]\s+(.*)/), li = l.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);
      if (task || li) { if (!list) { out.push("<ul>"); list = true; }
        out.push(task ? '<li class="task"><span>' + inline(task[1]) + "</span></li>" : "<li>" + inline(li[1]) + "</li>"); continue; }
      close();
      if (l.trim()) out.push("<p>" + inline(l) + "</p>");
    }
    close();
    return out.join("");
  }

  // ---------- состояние ----------
  let mic = true, items = [], current = null, tab = "notes", lastReady, livePhase = "idle";
  const PLACEHOLDER = $("view").innerHTML;
  $("mCall").onclick = () => { mic = true; $("scr").checked = false; $("mCall").setAttribute("aria-pressed", "true"); $("mVideo").setAttribute("aria-pressed", "false"); };
  $("mVideo").onclick = () => { mic = false; $("scr").checked = true; $("mVideo").setAttribute("aria-pressed", "true"); $("mCall").setAttribute("aria-pressed", "false"); };
  $("startForm").onsubmit = async (e) => {
    e.preventDefault();
    const r = await call("rec_start", $("title").value.trim(), mic, $("scr").checked);
    if (r && r.error) toast(r.error); else { $("title").value = ""; poll(); }
  };
  $("stopBtn").onclick = async () => { await call("rec_stop"); toast("Останавливаю — делаю конспект…"); poll(); };
  $("filter").oninput = renderList;

  async function loadList(selectId) {
    items = (await call("rec_list")) || [];
    if (selectId) current = selectId;
    if (!current && items.length) current = items[0].id;
    if (current && !items.some((i) => i.id === current)) current = items.length ? items[0].id : null;
    renderList();
    if (current) open(current, true);
    else if (livePhase !== "recording" && livePhase !== "processing") $("view").innerHTML = PLACEHOLDER;
  }
  function renderList() {
    const q = $("filter").value.trim().toLowerCase();
    const box = $("items"); box.replaceChildren();
    const shown = items.filter((i) => !q || (i.title + " " + i.id).toLowerCase().includes(q));
    if (livePhase === "recording" || livePhase === "processing") {
      const b = document.createElement("button"); b.className = "item";
      b.innerHTML = "<b>" + esc($("liveTitle").textContent || "Запись") + '</b><span class="live' + (livePhase === "processing" ? " busy" : "") + '">' +
        (livePhase === "recording" ? "● идёт запись" : "делаю конспект…") + "</span>";
      b.onclick = () => { current = null; showLive(); };
      box.appendChild(b);
    }
    if (!shown.length && !box.children.length) { box.innerHTML = '<div class="empty">' + (q ? "Ничего не нашлось" : "Записей пока нет") + "</div>"; return; }
    for (const it of shown) {
      const b = document.createElement("button"); b.className = "item";
      b.setAttribute("aria-current", String(it.id === current));
      b.innerHTML = "<b>" + esc(it.title) + "</b><span>" + when(it.started) + " · " + it.minutes + " мин" +
        '<i class="kind">' + (it.video ? "видео" : it.audio ? "звук" : "текст") + "</i></span>";
      b.onclick = () => open(it.id);
      box.appendChild(b);
    }
  }

  function showLive() {
    renderList();
    const v = $("view");
    v.innerHTML = '<div class="head"><div><h2>' + esc($("liveTitle").textContent) + '</h2><div class="meta">Текст появляется по ходу записи — примерно каждые полторы минуты</div></div></div>' +
      '<div class="tabs"><button aria-selected="true">Прямо сейчас</button></div><div class="body"><div class="lines" id="liveLines"></div></div>';
    paintLive(lastLive);
  }
  let lastLive = null;
  function paintLive(s) {
    const box = $("liveLines"); if (!box || !s) return;
    box.innerHTML = s.lines.length ? s.lines.map(lineHtml).join("") :
      '<div style="display:block;color:var(--muted)">Слушаю… первый текст появится через минуту-полторы.</div>';
    const body = box.parentElement; body.scrollTop = body.scrollHeight;
  }
  function lineHtml(l) { const m = l.match(/^\[([\d:]+)\]\s*(.*)$/);
    return m ? '<div data-t="' + secs(m[1]) + '"><span class="t">' + m[1] + "</span><span>" + esc(m[2]) + "</span></div>"
      : "<div><span></span><span>" + esc(l) + "</span></div>"; }

  async function open(id, keepTab) {
    current = id; if (!keepTab) tab = "notes";
    renderList();
    const r = await call("rec_get", id);
    const v = $("view");
    if (!r || !r.id) { v.innerHTML = '<div class="placeholder"><div>Запись не найдена</div></div>'; return; }
    v.innerHTML =
      '<div class="head"><div style="min-width:0"><h2 id="rTitle" contenteditable="true" spellcheck="false" title="Нажми, чтобы переименовать">' + esc(r.title) + "</h2>" +
      '<div class="meta">' + when(r.started) + " · " + r.minutes + " мин · " + (r.video ? "видео экрана + звук" : r.mic ? "звук компьютера + микрофон" : "звук компьютера") +
      (r.size_mb ? " · " + r.size_mb + " МБ" : "") + "</div></div>" +
      '<div class="acts">' + (r.audio || r.video ? '<button id="aPlay" title="Открыть в плеере Windows">В плеере</button>' : "") +
      '<button id="aFolder">Папка</button><button id="aPhone">На телефон</button><button class="del" id="aDel">Удалить</button></div></div>' +
      '<div class="player" id="player">' + (r.video ? '<video id="media" controls preload="metadata" src="' + esc(r.video) + '"></video>'
        : r.audio ? '<audio id="media" controls preload="metadata" src="' + esc(r.audio) + '"></audio>'
        : '<div class="nomedia">Звук этой записи не сохранился — есть только текст.</div>') + "</div>" +
      '<div class="tabs" role="tablist"><button role="tab" data-tab="notes">Конспект</button><button role="tab" data-tab="text">Полный текст</button></div>' +
      '<div class="body" id="rBody"></div>' +
      (r.audio || r.video ? '<div class="hint">Нажми на фразу или на время — запись перемотается туда. Так можно проверить слово, которое Atlas мог расслышать неправильно.</div>' : "") +
      '<div class="ask"><form id="askForm"><input id="askQ" placeholder="Спросить по записи — например, «что сказали про сроки?»" aria-label="Вопрос по записи"><button type="submit">Спросить</button></form><div class="answer" id="answer" hidden></div></div>';
    const paint = () => {
      v.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
      $("rBody").innerHTML = tab === "notes"
        ? (r.notes ? '<div class="notes">' + md(r.notes) + "</div>" : '<div class="placeholder"><div>Конспекта нет — в записи не нашлось речи.</div></div>')
        : (r.transcript ? '<div class="lines">' + r.transcript.split("\n").map(lineHtml).join("") + "</div>" : '<div class="placeholder"><div>Текста нет.</div></div>');
    };
    v.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => { tab = b.dataset.tab; paint(); follow(); });
    paint();
    // клик по фразе или по времени в конспекте — перемотать запись туда и включить
    const media = $("media");
    $("rBody").onclick = (e) => {
      const el = e.target.closest("[data-t]");
      if (!el || !media) return;
      media.currentTime = Math.max(0, Number(el.dataset.t) - 1); media.play().catch(() => {});
    };
    let lastNow = null;
    function follow() {
      if (!media || tab !== "text") return;
      const rows = $("rBody").querySelectorAll(".lines div[data-t]"); let cur = null;
      for (const d of rows) { if (Number(d.dataset.t) <= media.currentTime + 0.3) cur = d; else break; }
      if (cur === lastNow) return;
      if (lastNow) lastNow.classList.remove("now");
      lastNow = cur;
      if (cur) { cur.classList.add("now"); if (!media.paused) cur.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
    }
    if (media) media.ontimeupdate = follow;
    const t = $("rTitle");
    t.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); t.blur(); } };
    t.onblur = async () => { const n = t.textContent.trim(); if (n && n !== r.title) { await call("rec_rename", id, n); r.title = n; loadList(id); } };
    if ($("aPlay")) $("aPlay").onclick = () => call("rec_open_audio", id);
    $("aFolder").onclick = () => call("rec_open_folder", id);
    $("aPhone").onclick = async () => toast((await call("rec_to_phone", id)) || "Не получилось");
    $("aDel").onclick = async () => {
      if (!confirm("Удалить запись «" + r.title + "» вместе со звуком и текстом?")) return;
      await call("rec_delete", id); current = null; toast("Удалено"); loadList();
    };
    $("askForm").onsubmit = async (e) => {
      e.preventDefault(); const q = $("askQ").value.trim(); if (!q) return;
      const a = $("answer"); a.hidden = false; a.textContent = "Думаю…";
      a.textContent = (await call("rec_ask", id, q)) || "Не получилось ответить.";
    };
  }

  // ---------- живое состояние ----------
  async function poll() {
    const s = await call("rec_live");
    if (!s) return;
    lastLive = s;
    const rec = $("rec");
    const was = livePhase;
    livePhase = s.phase;
    rec.classList.toggle("on", s.phase === "recording");
    rec.classList.toggle("busy", s.phase === "processing");
    $("liveTitle").textContent = s.title || "Запись";
    $("timer").textContent = s.phase === "processing" ? "Конспект…" : fmt(s.seconds);
    $("liveSub").textContent = s.phase === "processing" ? (s.screen ? "Сохраняю видео, " : "") + "распознаю последние минуты и пишу конспект"
      : (s.mic ? "Звук компьютера + микрофон" : "Звук компьютера") + (s.screen ? " + экран" : "") + " · " + (s.lines.length ? s.lines.length + " фраз" : "слушаю");
    $("meter").style.width = Math.round(Math.min(1, s.level * 1.4) * 100) + "%";
    if (s.phase === "failed" && was !== "failed") toast("Запись не пошла: " + (s.error || "нет доступа к звуку"));
    if (was !== s.phase) {
      if (s.phase === "recording") { current = null; showLive(); }
      else renderList();
    }
    if (s.phase === "recording" && !current) paintLive(s);
    if (lastReady === undefined) lastReady = s.notes_ready;          // первый опрос — просто запомнить
    else if (s.notes_ready && s.notes_ready !== lastReady) {
      lastReady = s.notes_ready; toast("Конспект готов"); loadList(s.notes_ready);
    } else if (was === "processing" && s.phase === "idle") loadList();

  }
  function start() { loadList().then(poll); setInterval(poll, 1000); }
  if (window.pywebview && window.pywebview.api) start(); else window.addEventListener("pywebviewready", start);
})();
</script>
</body>
</html>
