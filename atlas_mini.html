<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Atlas mini</title>
<style>
  :root { --ion: #86D6FF; --ok: #3DFF9A; --warm: #FFC478; --text: #E6F0FF; --muted: #8FA6CF; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04070E; color: var(--text);
    font: 13px "Exo 2", "Segoe UI", sans-serif; user-select: none; }
  .m { position: relative; height: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px;
    border: 1px solid rgba(134,214,255,.22); background:
      radial-gradient(ellipse at 15% 50%, rgba(134,214,255,.10), transparent 60%),
      linear-gradient(160deg, rgba(10,22,44,.95), rgba(4,7,14,.98)); }
  .m::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(134,214,255,.025) 0 1px, transparent 1px 3px); }
  .m.speaking { border-color: rgba(134,214,255,.45); }
  .m.listening { border-color: rgba(61,255,154,.45); }
  .m.thinking { border-color: rgba(255,196,120,.4); }
  #star { width: 72px; height: 72px; flex: none; cursor: grab; }
  .txt { flex: 1; min-width: 0; cursor: grab; }
  .st { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .st b { color: var(--ion); font-weight: 600; }
  .m.listening .st b { color: var(--ok); } .m.thinking .st b { color: var(--warm); }
  .cap { margin-top: 4px; font-size: 13.5px; line-height: 1.35; color: var(--text); display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 18px; }
  .cap.user { color: var(--muted); }
  .btns { display: flex; flex-direction: column; gap: 6px; flex: none; position: relative; z-index: 2; }
  button { width: 26px; height: 26px; display: grid; place-items: center; padding: 0; border-radius: 7px; cursor: pointer;
    color: var(--text); border: 1px solid rgba(134,214,255,.2); background: rgba(134,214,255,.06); transition: background .15s; }
  button:hover { background: rgba(134,214,255,.18); }
  button.on { border-color: var(--ok); color: var(--ok); }
</style>
</head>
<body>
<div class="m" id="m">
  <canvas id="star" class="pywebview-drag-region" width="72" height="72"></canvas>
  <div class="txt pywebview-drag-region"><div class="st" id="st"><b>Atlas</b></div><div class="cap" id="cap"></div></div>
  <div class="btns">
    <button id="mic" title="Говорить"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="4" y="1" width="4" height="6.5" rx="2"/><path d="M2.2 5.6a3.8 3.8 0 0 0 7.6 0M6 9.6V11"/></svg></button>
    <button id="open" title="Открыть Atlas"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M7 1.5h3.5V5M5 10.5H1.5V7M10.5 1.5L7 5M1.5 10.5L5 7"/></svg></button>
    <button id="x" title="Скрыть"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 3l6 6M9 3L3 9"/></svg></button>
  </div>
</div>
<script>
(function () {
  const L = {
    ru: { idle: 'Готов', listening: 'Слушаю', thinking: 'Думаю', speaking: 'Говорю', talk: 'Говорить', open: 'Открыть Atlas', hide: 'Скрыть' },
    en: { idle: 'Ready', listening: 'Listening', thinking: 'Thinking', speaking: 'Speaking', talk: 'Talk', open: 'Open Atlas', hide: 'Hide' } };
  const TOOLS = {
    ru: { search_web: 'ищу в интернете', read_webpage: 'читаю страницу', browser_open: 'открываю сайт', browser_read_text: 'читаю страницу',
          open_app: 'открываю программу', desktop_type: 'печатаю', desktop_look: 'смотрю окно', desktop_hotkey: 'нажимаю клавиши',
          get_weather: 'смотрю погоду', holo_weather: 'погода', holo_show: 'ищу картинку', look: 'смотрю', play_on_spotify: 'включаю музыку',
          search_file_content: 'ищу файлы', execute_plan: 'выполняю план', start_mission: 'запускаю миссию', get_news: 'новости',
          learn_skill: 'учусь новому', day_report: 'итоги дня', study_start: 'тренировка', holo_graph: 'граф памяти' },
    en: { search_web: 'searching the web', read_webpage: 'reading a page', browser_open: 'opening a site', browser_read_text: 'reading a page',
          open_app: 'opening an app', desktop_type: 'typing', desktop_look: 'looking at the window', desktop_hotkey: 'pressing keys',
          get_weather: 'checking weather', holo_weather: 'weather', holo_show: 'finding a picture', look: 'looking', play_on_spotify: 'playing music',
          search_file_content: 'searching files', execute_plan: 'running the plan', start_mission: 'starting a mission', get_news: 'news',
          learn_skill: 'learning', day_report: 'daily recap', study_start: 'study session', holo_graph: 'memory graph' } };
  const m = document.getElementById('m'), st = document.getElementById('st'), cap = document.getElementById('cap');
  const cv = document.getElementById('star'), g = cv.getContext('2d');
  let S = { state: 'idle', lang: 'ru', level: 0, env: [], dur: 0, el: 0, t0: 0 }, traceSeen = -1, tool = '';
  const api = function () { return window.pywebview && window.pywebview.api; };
  function call(name) { const a = api(); return a && a[name] ? a[name].apply(null, [].slice.call(arguments, 1)) : Promise.reject(); }

  // --- звезда: дышит в покое, зеленеет и пульсирует от голоса, крутит кольцо, когда думает, вспыхивает в такт речи
  const dpr = window.devicePixelRatio || 1; cv.width = 72 * dpr; cv.height = 72 * dpr; g.scale(dpr, dpr);
  let last = 0, ang = 0;
  function draw(now) {
    requestAnimationFrame(draw);
    if (now - last < 33) return;                          // 30 кадров/с — окно маленькое, хватает
    const dt = (now - last) / 1000; last = now; ang += dt;
    g.clearRect(0, 0, 72, 72);
    const cx = 36, cy = 36, st0 = S.state;
    let amp = 0.15 + 0.08 * Math.sin(now / 900);
    let col = [134, 214, 255];
    if (st0 === 'listening') { col = [61, 255, 154]; amp = 0.25 + Math.min(1, S.level * 2.2) * 0.75; }
    if (st0 === 'thinking') { col = [255, 196, 120]; amp = 0.3; }
    if (st0 === 'speaking' && S.env.length && S.dur) {
      const p = Math.min(0.999, (S.el + (performance.now() - S.t0) / 1000) / S.dur);
      amp = 0.3 + (S.env[Math.floor(p * S.env.length)] || 0) * 0.9;
    }
    const r = 8 + amp * 8, gr = Math.min(34, r * 2.4);       // свечение не шире холста — без «квадрата»
    const glow = g.createRadialGradient(cx, cy, 0, cx, cy, gr);
    glow.addColorStop(0, 'rgba(' + col + ',.5)'); glow.addColorStop(1, 'rgba(' + col + ',0)');
    g.fillStyle = glow; g.beginPath(); g.arc(cx, cy, gr, 0, 7); g.fill();
    const core = g.createRadialGradient(cx - 2, cy - 2, 0, cx, cy, r);
    core.addColorStop(0, '#FFFFFF'); core.addColorStop(0.45, 'rgba(' + col + ',1)'); core.addColorStop(1, 'rgba(' + col + ',.15)');
    g.fillStyle = core; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
    g.strokeStyle = 'rgba(' + col + ',.35)'; g.lineWidth = 1;
    g.beginPath(); g.arc(cx, cy, 30, 0, 7); g.stroke();
    if (st0 === 'thinking') {                              // бегущая дуга
      g.strokeStyle = 'rgba(' + col + ',.95)'; g.lineWidth = 2; g.lineCap = 'round';
      g.beginPath(); g.arc(cx, cy, 30, ang * 3, ang * 3 + 1.4); g.stroke();
    }
  }
  requestAnimationFrame(draw);

  function poll() {
    call('get_state').then(function (s) {
      S.state = s.state || 'idle'; S.lang = s.language === 'en' ? 'en' : 'ru'; S.level = s.mic_level || 0;
      if (s.speech_duration && s.speech_duration !== S.dur) { S.env = s.speech_envelope || []; S.dur = s.speech_duration; }
      S.el = s.speech_elapsed || 0; S.t0 = performance.now();
      const T = L[S.lang];
      m.className = 'm ' + S.state;
      if (s.trace_seq !== undefined && s.trace_seq !== traceSeen) {
        traceSeen = s.trace_seq;
        call('get_trace_ui').then(function (tr) {
          const ev = ((tr && tr.events) || []).filter(function (e) { return e.t === 'tool'; }).pop();
          tool = ev && ev.state === 'run' ? (TOOLS[S.lang][ev.name] || ev.name.replace(/_/g, ' ')) : '';
        }).catch(function () {});
      }
      st.innerHTML = '<b>' + T[S.state] + '</b>' + (S.state === 'thinking' && tool ? ' · ' + tool : '');
      let text = '', who = '';
      if (S.state === 'speaking' && s.text) { text = s.text; who = 'Atlas'; }
      else if (s.chat_history && s.chat_history.length) { const h = s.chat_history[s.chat_history.length - 1]; text = h[1]; who = h[0]; }
      if (cap.textContent !== String(text)) cap.textContent = String(text || '');
      cap.classList.toggle('user', who === 'You');
      document.getElementById('mic').title = T.talk; document.getElementById('open').title = T.open; document.getElementById('x').title = T.hide;
    }).catch(function () {}).finally(function () { setTimeout(poll, 160); });
  }
  window.addEventListener('pywebviewready', poll);
  document.getElementById('mic').addEventListener('click', function () { call('push_to_talk').catch(function () {}); });
  document.getElementById('open').addEventListener('click', function () { call('mini_open_main').catch(function () {}); });
  document.getElementById('x').addEventListener('click', function () { call('mini_hide').catch(function () {}); });
  cv.addEventListener('dblclick', function () { call('mini_open_main').catch(function () {}); });
})();
</script>
</body>
</html>
