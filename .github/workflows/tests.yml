name: tests

on:
  push:
  pull_request:

jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Brain (offline, no keys)
        run: python tests/test_brain.py
      - name: Fast commands and control words
        run: python tests/test_commands.py
      - name: Main loop
        run: python tests/test_main.py
