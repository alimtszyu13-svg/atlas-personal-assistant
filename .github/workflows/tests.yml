# Автопроверка: на каждый push и pull request — все тесты Atlas и экзамен маршрутизатора.
# Если что-то сломалось — на GitHub у коммита появится красный крестик, а в логе будет видно, где.
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ATLAS_TESTING: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: ffmpeg (для тестов видео)
        run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - name: Библиотеки Python для тестов
        run: pip install -r requirements-test.txt
      - name: Все тесты
        run: python tests/run_all.py
      - name: Экзамен маршрутизатора
        run: python -m evals.run
      - name: Результаты экзамена
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals
          path: evals/results/
          if-no-files-found: ignore
