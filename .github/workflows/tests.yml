name: tests

on:
  push:
  pull_request:

jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pillow
      - run: python tests/test_brain.py
      - run: python tests/test_commands.py
      - run: python tests/test_emotions.py
      - run: python tests/test_logbook.py
      - run: python tests/test_main.py
      - run: python tests/test_phone.py
      - run: python tests/test_spotify.py
