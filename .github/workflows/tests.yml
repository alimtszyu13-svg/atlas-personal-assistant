name: tests

on:
  push:
  pull_request:

jobs:
  brain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Brain tests (offline, no keys)
        run: python tests/test_brain.py
