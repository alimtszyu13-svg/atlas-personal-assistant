# Бесплатный сервер облачного Atlas засыпает после 15 минут без запросов и просыпается около минуты.
# GitHub будит его каждые 10 минут. Адрес: GitHub → Settings → Secrets and variables → Actions →
# Variables → ATLAS_CLOUD_URL (например https://atlas-xxxx.onrender.com).
name: keep cloud Atlas awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.ATLAS_CLOUD_URL != '' }}
    steps:
      - run: curl -fsS --max-time 120 "${{ vars.ATLAS_CLOUD_URL }}/manifest.webmanifest" -o /dev/null && echo "Atlas в облаке на связи"
